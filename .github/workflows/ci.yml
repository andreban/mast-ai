name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --ignore-scripts

      - run: npm run lint

      - name: Check formatting
        run: npm run format -- --check

      - run: npm run build -w packages/core -w packages/google-genai -w packages/built-in-ai
