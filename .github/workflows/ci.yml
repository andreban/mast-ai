name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Using `npm install` rather than `npm ci` because the lockfile is
      # generated on Windows and does not contain Linux-specific optional
      # rollup binaries (npm/cli#4828). `npm ci` would fail to resolve them.
      - run: npm install

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build -w @mast-ai/core -w @mast-ai/google-genai -w @mast-ai/built-in-ai -w @mast-ai/react-ui

      - run: npm test --workspaces --if-present
